spring:
  datasource:
    url: jdbc:h2:mem:alertapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

alertapp:
  ia:
    # Puerto sin servicio: obliga a probar el respaldo en Java de la analítica.
    url: http://localhost:1
    timeout-ms: 300
  evidencias:
    carpeta: ./target/evidencias-test
  seed:
    habilitado: false
